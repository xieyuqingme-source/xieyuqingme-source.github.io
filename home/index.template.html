<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>谢雨卿 · 雨聊</title>
  <meta name="description" content="谢雨卿的个人网站：文章、照片、小游戏和每天的简报。">
  <meta name="author" content="谢雨卿 Xie Yuqing">
  <link rel="canonical" href="{{site_url}}/">
  <link rel="alternate" hreflang="zh-CN" href="{{site_url}}/">
  <link rel="alternate" hreflang="en" href="{{site_url}}/en/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="谢雨卿 · 雨聊">
  <meta property="og:description" content="谢雨卿的个人网站：文章、照片、小游戏和每天的简报。">
  <meta property="og:url" content="{{site_url}}/">
  <meta property="og:image" content="{{site_url}}/assets/share-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="谢雨卿 · 雨聊：文章、作品与足迹">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/favicon.ico?v=qinghuan-1" sizes="any">
  <link rel="icon" href="/assets/favicon.svg?v=qinghuan-1" type="image/svg+xml">
  <script>(() => { let theme = "light", saved; try { saved = localStorage.getItem("xieyuqing-blog-theme"); } catch (_) {} if (saved === "light" || saved === "dark") theme = saved; else try { if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark"; } catch (_) {} document.documentElement.dataset.theme = theme; })();</script>
  <link rel="stylesheet" href="/assets/portal.css">
  <link rel="stylesheet" href="/assets/home-daily.css">
  <script src="/assets/portal.js" defer></script>
</head>
<body class="daily-home-page">
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="site-header container">
    <a class="brand" href="/" aria-label="谢雨卿个人主页"><span><span lang="zh-CN">谢雨卿</span><small lang="en">Xie Yuqing · Carl</small></span></a>
    <nav class="site-nav" aria-label="主导航"><a href="/articles/">文章</a><a href="/anthology/">雨聊文选</a><a href="/projects/">作品</a><a href="/map/">足迹</a><a href="/photos/">照片</a><a href="/game/">小游戏</a><a href="/about/">关于</a><a class="site-language-switch" href="/en/" lang="en" aria-label="切换网站语言为英语">EN</a></nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式" hidden><span class="theme-label">深色</span></button>
  </header>
  <main id="main" class="container home">
    <div class="home-top">
    <section class="home-hero" aria-labelledby="home-title">
      {{home_avatar}}
      <div class="hero-copy">
        <h1 id="home-title">谢雨卿</h1>
        <p class="hero-signature"><span data-i18n="common.signature.1"></span></p>
      </div>
    </section>
    <section id="brief" class="daily-home home-glance" data-brief-mode="glance" aria-labelledby="glance-title" data-lunar-src="/assets/vendor/lunar-javascript-1.7.7.js" data-d3-src="/assets/vendor/d3-7.9.0.min.js" data-earth-src="/assets/home-earth.js">
      <div class="section-head"><h2 id="glance-title">今日简报</h2><a href="/today/">看完整简报 <span aria-hidden="true">→</span></a></div>
      <div class="glance-layout">
        <a class="glance-cards" href="/today/" aria-label="今日简报：日期、节气和黄历">
          <span class="glance-card"><strong class="glance-main" id="glance-date">—</strong><span class="glance-detail" id="daily-calendar-lunar">—</span><span class="glance-detail" id="daily-calendar-festivals" hidden></span></span>
          <span class="glance-card"><strong class="glance-main" id="daily-calendar-term">—</strong><span class="glance-detail" id="daily-calendar-next-term"></span></span>
          <span class="glance-card" id="glance-almanac-card"><span class="glance-main"><span class="glance-yi">宜 </span><span id="daily-almanac-yi">—</span></span><span class="glance-detail"><span class="glance-ji">忌 </span><span id="daily-almanac-ji">—</span></span><small class="glance-note">仅供一乐</small></span>
        </a>
        <div class="glance-earth" id="daily-earth"><canvas id="earth-canvas" width="280" height="286" role="img" aria-label="可拖动的地球昼夜图"></canvas><p id="daily-local-time"></p></div>
      </div>
      <noscript><p class="yl-no-script">启用 JavaScript 后显示日期、节气、黄历和地球。</p></noscript>
    </section>
    </div>
    <section class="home-section home-writing" id="writing" aria-labelledby="writing-title">
      <div class="section-head"><h2 id="writing-title">文章</h2></div>
      <div class="article-entries"><a class="article-entry" href="/articles/"><strong>全部文章</strong><span>{{chinese_total}} 篇中文 · {{english_total}} 篇英文练习</span></a><a class="article-entry" href="/anthology/"><strong>雨聊文选</strong><span>选录的中外文学原文 · {{anthology_total}} 篇</span></a><button class="article-entry home-random" id="home-random-button" type="button" hidden><strong>随便看一篇</strong><span>从全部文章里随机挑一篇</span></button></div>
    </section>
    <section class="home-section home-photos" id="home-photos" aria-labelledby="home-photos-title">
      <div class="section-head"><h2 id="home-photos-title">照片</h2><a href="/photos/">全部照片 <span aria-hidden="true">→</span></a></div>
      <div class="home-photo-grid">{{home_photos}}</div>
    </section>
    <section class="home-section" id="projects" aria-labelledby="projects-title">
      <div class="section-head"><h2 id="projects-title">作品和小游戏</h2><div class="section-actions"><a href="/projects/">全部作品 <span aria-hidden="true">→</span></a><a href="/game/">小游戏 <span aria-hidden="true">→</span></a></div></div>
      <div class="yl-project-grid">{{home_project_cards}}</div>
    </section>
  </main>
  <footer class="site-footer container"><p>谢雨卿</p><div><a href="/articles/">文章</a><a href="/about/">关于</a><a href="/articles/feed.xml">RSS</a></div></footer>
  <script id="home-random-data" type="application/json">{{home_article_links}}</script>
  <script src="/assets/astronomy-solar.js" defer></script>
  <script src="/assets/home-daily.js" defer></script>
</body>
</html>
