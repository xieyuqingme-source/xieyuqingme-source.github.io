name: Publish personal site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update news snapshot]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Require the renamed root repository
        run: |
          if [ "$GITHUB_REPOSITORY" != "xieyuqingme-source/xieyuqingme-source.github.io" ]; then
            echo "::error::Rename and update remotes before publishing this unified site."
            exit 1
          fi
      - name: Read repository
        uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Markdown parser
        run: python -m pip install -r blog/requirements.txt
      - name: Check Markdown compatibility
        run: python scripts/test_build_blog.py
      - name: Check English publication and translation freshness
        run: |
          python scripts/test_site_i18n.py
          python scripts/test_site_i18n_build.py
          node scripts/test_site_i18n.cjs
          python scripts/test_english_site.py
          node scripts/test_english_archive.cjs
          node scripts/test_english_waline.mjs
          python scripts/check_translations.py
      - name: Check responsive image generation
        run: python scripts/test_image_assets.py
      - name: Check photography export and public pages
        run: python -m unittest discover -s scripts -p "test*photos*.py"
      - name: Check photography lightbox interactions
        run: node scripts/test_photos_logic.cjs
      - name: Check footprints data, map, journey and local exports
        run: |
          python scripts/test_map_pages.py
          python scripts/test_footprints_people.py
          python scripts/test_map_i18n.py
          node scripts/test_map_i18n.cjs
          node scripts/test_map_logic.cjs
          node scripts/test_map_journey.cjs
          node scripts/test_map_view.cjs
          node scripts/test_map_labels.cjs
          node scripts/test_map_avatar.cjs
          node scripts/test_map_playback.cjs
          node scripts/test_map_video.cjs
          node scripts/test_music.cjs
          python scripts/test_site_navigation.py
          node --check home/assets/site-navigation.js
          python scripts/test_music_assets.py
          node scripts/test_map_video_layout.cjs
      - name: Check unified site rules
        run: |
          python scripts/test_build_site.py
          python scripts/test_branding.py
          python scripts/test_news_snapshot.py
          python scripts/test_history_today.py
          python scripts/test_daily_brief_reading.py
      - name: Check homepage astronomy and navigation history
        run: |
          node --test scripts/test_home_earth.cjs
          node --test scripts/test_home_daily.cjs
          node --test scripts/test_daily_reading.cjs
          node --test scripts/test_weather_map.cjs
          node --check home/assets/weather-map.js
          node --check home/assets/daily-reading.js
          node scripts/test_site_navigation_history.cjs
          node --check home/assets/home-daily.js
          python scripts/test_compact_header.py
      - name: Check anthology content and static routes
        run: |
          python scripts/test_anthology_pages.py
          python scripts/test_anthology_i18n.py
          node --check home/assets/anthology-selection.js
          node scripts/test_anthology_selection.cjs
      - name: Check Learn English and exact number conversion
        run: |
          python scripts/test_english_corner.py
          python scripts/test_english_v2.py
          python scripts/test_english_quiz.py
          node --test scripts/test_english_play.cjs
          node --test scripts/test_english_quotes.cjs
          node --test scripts/test_english_word_map.cjs
          node --check home/assets/english-word-map.js
          python scripts/test_reading_annotations.py
          node --test scripts/test_reading_annotations.cjs
          node --test scripts/test_english_speech.cjs
          node --check home/assets/reading-annotations.js
          node --check home/assets/english-speech.js
          node scripts/test_english_numbers.cjs
          node --check home/assets/english-corner.js
          node --check home/assets/english-numbers.js
      - name: Check local about routes
        run: python scripts/test_about_routes.py
      - name: Check Read Marx and Engels public sources and reader
        run: |
          python scripts/test_marx_engels.py
          node --test scripts/test_marx_engels_logic.cjs
          node --check home/assets/marx.js
          node --check scripts/test_marx_engels_browser.cjs
      - name: Check local game routes and navigation
        run: python scripts/test_game_routes.py
      - name: Check ranking model, persistence and export layout
        run: |
          node --test scripts/test_ranking_logic.cjs
          node --test scripts/test_ranking_i18n.cjs
          node --test scripts/test_ranking_template_storage.cjs
          node --test scripts/test_ranking_dark.cjs
      - name: Check local image normalization and crop geometry
        run: node --test scripts/test_ranking_images.cjs
      - name: Check theme preference and system fallback
        run: node scripts/test_theme_defaults.cjs
      - name: Check disabled Waline integration
        run: node scripts/test_waline_logic.mjs
      - name: Check reading table of contents
        run: node scripts/test_toc_logic.cjs
      - name: Restore validated responsive image cache
        uses: actions/cache@v5
        with:
          # Both generator ownership markers are required for a cache-only output.
          # Do not cache original photos, HTML, local drafts or the rest of the site.
          path: |
            _site_unified/.generated-by-unified-site
            _site_unified/articles/.generated-by-blog
            _site_unified/articles/assets/responsive-images
          key: ${{ runner.os }}-responsive-images-v1-${{ hashFiles('scripts/image_assets.py', 'blog/requirements.txt') }}-${{ hashFiles('images/**', '附属资料/**') }}
          restore-keys: |
            ${{ runner.os }}-responsive-images-v1-${{ hashFiles('scripts/image_assets.py', 'blog/requirements.txt') }}-
      - name: Restore optional last valid news snapshot
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/news_snapshot.py restore --output "$RUNNER_TEMP/news-snapshot.json"
      - name: Build and check personal site
        env:
          BLOG_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEWS_SNAPSHOT_PATH: ${{ runner.temp }}/news-snapshot.json
        run: |
          python scripts/build_site.py --site-url "$BLOG_SITE_URL"
          python scripts/check_site.py --site-url "$BLOG_SITE_URL"
      - name: Check archive interactions
        run: |
          python scripts/test_archive_pages.py
          python scripts/test_english_corner.py --publication
          python scripts/test_marx_engels.py --publication
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site_unified

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
